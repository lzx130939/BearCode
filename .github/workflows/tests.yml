name: Offline runtime tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
        utf8: ['1']
        include:
          - os: windows-latest
            python: '3.12'
            utf8: '0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: ${{ matrix.utf8 }}
      PYTHONIOENCODING: ${{ matrix.utf8 == '0' && 'cp1252' || 'utf-8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -q
      - run: git diff --check
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
      - run: node --test web/tests/*.test.mjs
